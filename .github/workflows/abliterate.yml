name: Gemma 4 Refusal Removal & GGUF 4-bit Quantization

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face Model Repo ID'
        required: true
        default: 'google/gemma-4-E2B-it'
      output_name:
        description: 'Output Folder / Package Name'
        required: true
        default: 'gemma-4-E2B-abliterated-Q4_K_M.gguf'

jobs:
  abliterate-and-quantize:
    runs-on: ubuntu-latest
    name: Run Abliteration and GGUF Quantization

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add 8GB Swap File
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone & Build llama.cpp (CMake)
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          pip install -r llama.cpp/requirements.txt
          cd llama.cpp && cmake -B build && cmake --build build --config Release --target llama-quantize -j$(nproc)

      - name: Install Latest Transformers & PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "transformers>=5.19.0" torch accelerate huggingface_hub sentencepiece gguf cmake

      - name: Run Abliteration (Weight Orthogonalization)
        run: |
          python abliterate.py --model "${{ github.event.inputs.model_id }}" --output "./gemma-4-E2B-abliterated"

      - name: Convert to F16 GGUF & Quantize to Q4_K_M (2.5GB)
        run: |
          python llama.cpp/convert_hf_mock_huggingface_key_string_12.py ./gemma-4-E2B-abliterated --outfile ./gemma-4-E2B-abliterated-f16.gguf --outtype f16
          ./llama.cpp/build/bin/llama-quantize ./gemma-4-E2B-abliterated-f16.gguf ./${{ github.event.inputs.output_name }} Q4_K_M
          rm -rf ./gemma-4-E2B-abliterated ./gemma-4-E2B-abliterated-f16.gguf
          ls -lh ./${{ github.event.inputs.output_name }}

      - name: Archive GGUF Model Artifact (~2.5GB)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: ./${{ github.event.inputs.output_name }}
          retention-days: 7
